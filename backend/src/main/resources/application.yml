# Base config shared by every profile. All secrets/environment-specific
# values come from env vars (with local-dev-friendly defaults) — nothing
# sensitive is hardcoded here.
spring:
  application:
    name: job-trail

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobtrail}
    username: ${DB_USERNAME:jobtrail}
    password: ${DB_PASSWORD:jobtrail}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    # Flyway migrates before Hibernate validates (wired in FlywayConfig, since
    # Spring Boot 4's autoconfigure module dropped Flyway autoconfiguration),
    # so it's safe to only ever validate here, never let Hibernate touch DDL.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # Plain SMTP client config — provider-agnostic on purpose (see pom.xml).
  # Local dev default (localhost:1025, no auth) matches a catch-all dev SMTP
  # server (e.g. Mailpit/MailHog); point these at a real relay in any
  # environment that should actually deliver mail.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      # Set a little above app.documents.max-size-bytes below: the app's own
      # check is what should produce the friendly 413 for an oversized
      # resume/cover-letter upload, not Spring's multipart parser rejecting
      # the request first with a less specific error.
      max-file-size: ${DOCUMENT_UPLOAD_MAX_FILE_SIZE:15MB}
      max-request-size: ${DOCUMENT_UPLOAD_MAX_REQUEST_SIZE:15MB}

server:
  port: ${SERVER_PORT:8080}

app:
  mail:
    from: ${MAIL_FROM:no-reply@jobtrail.dev}
  jwt:
    # Dev-only fallback — long enough to satisfy HS256's 256-bit minimum key
    # size, but every real environment must set JWT_SECRET itself.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-deploy-please-32b+}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
  # No dev-only fallback here (unlike jwt.secret above): there's no
  # meaningful default OAuth client id/secret, so local dev either sets its
  # own (a free client registered against http://localhost) or simply
  # doesn't exercise the /api/auth/oauth/** endpoints.
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
  scheduling:
    auto-ghost-cron: ${AUTO_GHOST_CRON:0 0 3 * * *} #cron runs at 3AM
    stale-after: ${AUTO_GHOST_STALE_AFTER:P14D} #14 stale days
    reminder-cron: ${REMINDER_CRON:0 0 9 * * *} #cron runs at 9AM
    reminder-lookahead: ${REMINDER_LOOKAHEAD:P3D} #3 days lookahead for reminders
  documents:
    max-size-bytes: ${DOCUMENT_MAX_SIZE_BYTES:10485760} # 10MB
    storage:
      # MinIO's local dev default root credentials/port (see docker-compose.yml's
      # minio service) — never used outside local dev, same as the mail/DB
      # defaults above.
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:jobtrail}
      secret-key: ${MINIO_SECRET_KEY:jobtrail123}
      bucket: ${MINIO_BUCKET:job-trail-documents}
      presigned-url-ttl: ${MINIO_PRESIGNED_URL_TTL:PT10M}
  ml-service:
    # localhost default matches this app's own local-dev posture: it runs
    # on the host (./mvnw spring-boot:run), reaching ml-service's compose
    # container via its loopback-only published port (see
    # docker-compose.yml). A real deploy, where both services run on the
    # same internal network, overrides this to the container/service name
    # (e.g. http://ml-service:8000) — never a public URL either way.
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}
    # Blank by default (no header sent) so local dev works with ml-service's
    # own MLSVC_INTERNAL_API_KEY also unset. Every real deploy should set
    # this to the same value as ml-service's MLSVC_INTERNAL_API_KEY.
    shared-secret: ${ML_SERVICE_SHARED_SECRET:}
    connect-timeout: ${ML_SERVICE_CONNECT_TIMEOUT:PT3S}
    # Generous: covers ml-service's own scrape (MLSVC_SCRAPE_TIMEOUT_SECONDS,
    # default 10s) plus its LLM extraction call (MLSVC_OPENAI_TIMEOUT_SECONDS,
    # default 30s).
    read-timeout: ${ML_SERVICE_READ_TIMEOUT:PT45S}
    max-retries: ${ML_SERVICE_MAX_RETRIES:2}
    retry-backoff: ${ML_SERVICE_RETRY_BACKOFF:PT1S}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

---
# Local development: verbose SQL logging, nothing else differs from base.
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.anusha.job_trail: DEBUG

---
# Test profile: points at a separate database so tests never touch dev data.
# Override via env vars in CI; these defaults assume the docker-compose db.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobtrail_test}
    username: ${DB_USERNAME:jobtrail}
    password: ${DB_PASSWORD:jobtrail}
  jpa:
    hibernate:
      ddl-auto: validate

# "-" is Spring's documented "never fire" cron value. Tests call the job
# services directly to control timing exactly — a real background sweep
# racing against test data (seeded, then asserted on) would make the suite
# flaky for no benefit.
app:
  scheduling:
    auto-ghost-cron: "-"
    reminder-cron: "-"
  # No ml-service in the test profile's docker-compose/testcontainers setup
  # — a short timeout and zero retries keep any test that hits
  # JobPostingParseService fast (it should still assert the graceful
  # fallback, not a live parse) instead of waiting out the base profile's
  # 45s read timeout and two retries.
  ml-service:
    connect-timeout: PT0.5S
    read-timeout: PT1S
    max-retries: 0
